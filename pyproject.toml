[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paraview-mcp"
version = "0.2.0"
description = "MCP (Model Context Protocol) server for ParaView visualization control"
readme = "README_ja.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Shusen Liu", email = "liu42@llnl.gov"},
    {name = "Haichao Miao", email = "miao1@llnl.gov"},
]
maintainers = [
    {name = "Shusen Liu", email = "liu42@llnl.gov"},
    {name = "Haichao Miao", email = "miao1@llnl.gov"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.10.0,<2.0.0",  # Pin to compatible version range (tested with 1.10.1)
    "Pillow>=9.0.0",
]

[project.scripts]
paraview-mcp = "paraview_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/tatebayashit/paraview_mcp"
Repository = "https://github.com/tatebayashit/paraview_mcp"
Issues = "https://github.com/tatebayashit/paraview_mcp/issues"
Upstream = "https://github.com/LLNL/paraview_mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/paraview_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (no black anymore; not worth reflowing every message string)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "UP031", # percent formatting: deliberate, consistent style carried over from the
             # hardware-validated M0 spike (docs/M0_SPIKE.md) throughout bridge/ and src/
]
