[project]
name = "paraview-mcp"
version = "0.2.0"
description = "MCP (Model Context Protocol) server for ParaView visualization control"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Shusen Liu", email = "liu42@llnl.gov"},
    {name = "Haichao Miao", email = "miao1@llnl.gov"},
]
maintainers = [
    {name = "Shusen Liu", email = "liu42@llnl.gov"},
    {name = "Haichao Miao", email = "miao1@llnl.gov"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.10.0,<2.0.0",  # Pin to compatible version range (tested with 1.10.1)
    "httpx>=0.24.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/LLNL/paraview_mcp"
Documentation = "https://paraview-mcp.readthedocs.io"
Repository = "https://github.com/LLNL/paraview_mcp"
Issues = "https://github.com/LLNL/paraview_mcp/issues"

[tool.uv]
# No installable package yet -- the bridge (docs/DESIGN.md 4.1) runs inside
# ParaView's own bundled Python, not this environment, and the MCP server
# package (M1) doesn't exist yet. uv only needs to manage this venv's
# dependencies for now; re-enable packaging once src/ reappears.
package = false

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
]
exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
]
